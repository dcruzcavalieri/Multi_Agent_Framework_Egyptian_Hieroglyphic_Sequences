[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egydet"
version = "0.1.0.dev0"
description = "Determinative detection in Egyptian hieroglyphic sequences (MdC)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-docx>=0.8.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
egydet-gold = "egydet.gold.build:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
